<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT-Pulse | Fullscreen GIS Fleet & Geofence Map Explorer</title>

  <!-- Google Fonts: Barlow Condensed (Caterpillar Official Corporate Font across ALL text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cat: {
              yellow: '#FFCD00',
              hover: '#E5B800',
              dark: '#000000',
              charcoal: '#111827',
              slate: '#1e293b'
            }
          },
          fontFamily: {
            sans: ['"Barlow Condensed"', 'sans-serif'],
            heading: ['"Barlow Condensed"', 'sans-serif'],
            display: ['"Barlow Condensed"', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"Barlow Condensed"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Leaflet GIS CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Clean Light Industrial Theme Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-900 h-screen w-screen overflow-hidden flex flex-col font-sans">

  <!-- TOP HEADER (CLEAN WHITE SAAS DESIGN) -->
  <header class="bg-white border-b border-slate-200 px-5 py-3 flex items-center justify-between z-30 shrink-0 shadow-sm">
    <div class="flex items-center gap-3.5">
      <!-- Authentic Caterpillar Logo Image -->
      <a href="index.html" class="flex items-center">
        <img src="caterpillar_logo.png" alt="CATERPILLAR" class="h-9 w-auto object-contain">
      </a>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-slate-900 font-extrabold text-sm tracking-tight">CAT-Pulse GIS Command Center</h1>
          <span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-mono font-bold uppercase">
            Live Geofences & GPS Telemetry
          </span>
        </div>
        <p class="text-slate-500 text-xs">Caterpillar Heavy Machinery Real-Time GPS Tracking & Regional Logistics Corridors</p>
      </div>
    </div>

    <!-- Map Tile Switcher & Main Dashboard Link -->
    <div class="flex items-center gap-2.5">
      <!-- Tile Switcher -->
      <div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200 text-xs">
        <button id="btn-tile-streets" onclick="setExplorerTile('streets')" class="px-3 py-1 rounded-lg font-bold bg-amber-400 text-slate-950 shadow-sm">
          🗺️ Clean Streets
        </button>
        <button id="btn-tile-satellite" onclick="setExplorerTile('satellite')" class="px-3 py-1 rounded-lg font-bold text-slate-600 hover:text-slate-900">
          🛰️ Satellite
        </button>
        <button id="btn-tile-dark" onclick="setExplorerTile('dark')" class="px-3 py-1 rounded-lg font-bold text-slate-600 hover:text-slate-900">
          🌙 Dark Mode
        </button>
      </div>

      <a href="index.html" class="cat-btn-primary px-3.5 py-1.5 rounded-xl text-xs font-black flex items-center gap-1.5 shadow">
        <span>🚜</span> Open Control Tower
      </a>
    </div>
  </header>

  <!-- MAIN MAP WORKSPACE -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- COLLAPSIBLE LEFT SIDEBAR (CLEAN WHITE) -->
    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-20 shrink-0 shadow-sm">
      
      <!-- Sidebar Tabs -->
      <div class="p-3.5 border-b border-slate-200 bg-slate-50">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-900 uppercase tracking-wider">Infrastructure Corridor</span>
          <span class="text-[10px] font-mono font-bold text-amber-900 bg-amber-100 px-2 py-0.5 rounded-full border border-amber-300">
            6 Sites + 1 Hub
          </span>
        </div>
        <input type="text" id="sidebar-search" oninput="filterSidebarAssets(this.value)" placeholder="Search machines or jobsites..." class="w-full bg-white border border-slate-300 text-slate-900 rounded-xl px-3 py-1.5 text-xs focus:border-amber-400 outline-none shadow-sm">
      </div>

      <!-- Quick Jobsites List -->
      <div class="p-3 border-b border-slate-200 bg-white space-y-1.5">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Jobsites & Staging</span>
        <div class="grid grid-cols-2 gap-1.5 text-[11px]">
          <button onclick="explorerFlyTo('HUB')" class="p-1.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 rounded-lg text-left font-bold truncate shadow-sm">
            🏭 CAT Thiruvallur
          </button>
          <button onclick="explorerFlyTo('S001')" class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-left truncate">
            📍 S001: Metro II
          </button>
          <button onclick="explorerFlyTo('S002')" class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-left truncate">
            📍 S002: Port Terminal
          </button>
          <button onclick="explorerFlyTo('S003')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 rounded-lg text-left font-bold truncate animate-pulse">
            ⚠️ S003: Aerospace
          </button>
          <button onclick="explorerFlyTo('S004')" class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-left truncate">
            📍 S004: ORR Highway
          </button>
          <button onclick="explorerFlyTo('S005')" class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-left truncate">
            📍 S005: Solar Grid
          </button>
          <button onclick="explorerFlyTo('S006')" class="p-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-left truncate col-span-2">
            📍 S006: Kanchipuram Stone Mining Quarry
          </button>
        </div>
      </div>

      <!-- Live Assets Stream List -->
      <div class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50/50" id="sidebar-asset-list">
        <!-- Dynamically rendered -->
      </div>

      <!-- Sidebar Footer -->
      <div class="p-3 border-t border-slate-200 bg-white text-xs flex items-center justify-between text-slate-600">
        <span class="flex items-center gap-1 font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> 25 Machines Online
        </span>
        <button onclick="resetExplorerView()" class="text-[11px] text-amber-800 hover:text-amber-900 font-bold">
          Center Map
        </button>
      </div>
    </aside>

    <!-- FULLSCREEN LEAFLET CONTAINER -->
    <div id="full-map-container" class="flex-1 h-full w-full bg-slate-100"></div>

  </div>

  <!-- SCRIPTS -->
  <script src="data.js"></script>
  <script src="analytics.js"></script>

  <script>
    let explorerMap = null;
    let explorerCurrentTile = null;
    let explorerAssetMarkers = [];
    let explorerSupplyLines = [];
    let explorerSiteLayers = [];

    const EXPLORER_TILES = {
      streets: {
        name: "Clean Street Map",
        url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        options: { attribution: "&copy; OpenStreetMap contributors | CAT-Pulse GIS", maxZoom: 19 }
      },
      satellite: {
        name: "Satellite Imagery",
        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        options: { attribution: "Tiles &copy; Esri &mdash; Source: Esri, USGS", maxZoom: 18 }
      },
      dark: {
        name: "Dark Industrial",
        url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        options: { attribution: "&copy; OpenStreetMap &copy; CARTO", subdomains: "abcd", maxZoom: 19 }
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      initExplorerMap();
      renderSidebarAssets(SEED_DATA.assets);
    });

    function initExplorerMap() {
      explorerMap = L.map('full-map-container', {
        center: [12.9800, 80.0500],
        zoom: 11,
        zoomControl: true
      });

      setExplorerTile('streets');
      renderExplorerSupplyLines();
      renderExplorerSites();
      renderExplorerAssets();
    }

    function setExplorerTile(layerKey) {
      if (!explorerMap) return;
      if (explorerCurrentTile) explorerMap.removeLayer(explorerCurrentTile);

      const provider = EXPLORER_TILES[layerKey] || EXPLORER_TILES.streets;
      explorerCurrentTile = L.tileLayer(provider.url, provider.options).addTo(explorerMap);

      ["streets", "satellite", "dark"].forEach(t => {
        const btn = document.getElementById(`btn-tile-${t}`);
        if (btn) {
          if (t === layerKey) {
            btn.className = "px-3 py-1 rounded-lg font-bold bg-amber-400 text-slate-950 shadow-sm";
          } else {
            btn.className = "px-3 py-1 rounded-lg font-bold text-slate-600 hover:text-slate-900";
          }
        }
      });
    }

    function renderExplorerSupplyLines() {
      const hub = SEED_DATA.dealerHub;
      SEED_DATA.sites.forEach(site => {
        const isDeficit = site.id === "S003";
        const line = L.polyline([[hub.lat, hub.lng], [site.lat, site.lng]], {
          color: isDeficit ? "#E11D48" : "#D97706",
          weight: isDeficit ? 3 : 2,
          opacity: isDeficit ? 0.9 : 0.6,
          dashArray: isDeficit ? "6, 8" : "4, 6"
        }).addTo(explorerMap);
        explorerSupplyLines.push(line);
      });
    }

    function renderExplorerSites() {
      const hub = SEED_DATA.dealerHub;
      const hubIcon = L.divIcon({
        className: "cat-hub-pin",
        html: `<div class="flex flex-col items-center justify-center w-12 h-12 bg-amber-400 border-2 border-black rounded-2xl shadow-xl font-black text-black text-xs">
          <span class="text-sm leading-none font-black">CAT</span>
          <span class="text-[8px] font-bold uppercase tracking-tighter">HUB</span>
        </div>`,
        iconSize: [48, 48],
        iconAnchor: [24, 24]
      });

      L.marker([hub.lat, hub.lng], { icon: hubIcon })
        .bindPopup(`
          <div class="p-4 bg-white text-slate-900 rounded-2xl text-xs font-sans min-w-[240px]">
            <div class="text-slate-900 font-black uppercase text-sm">🏭 ${hub.name}</div>
            <div class="text-slate-500 mt-0.5 text-xs">${hub.location}</div>
          </div>
        `).addTo(explorerMap);

      SEED_DATA.sites.forEach(site => {
        const isDeficit = site.forecastDeficit;
        L.circle([site.lat, site.lng], {
          color: isDeficit ? "#E11D48" : "#D97706",
          fillColor: isDeficit ? "#F43F5E" : "#F59E0B",
          fillOpacity: 0.18,
          weight: 2.5,
          dashArray: isDeficit ? "6, 6" : null,
          radius: site.radiusMeters
        }).addTo(explorerMap);

        const siteIcon = L.divIcon({
          className: "cat-site-pin",
          html: `<div class="px-3 py-1 bg-white border ${isDeficit ? "border-rose-400 text-rose-700" : "border-slate-300 text-slate-800"} rounded-xl shadow-md text-xs font-bold whitespace-nowrap">
            📍 ${site.id}: ${site.name}
          </div>`,
          iconSize: [160, 30],
          iconAnchor: [80, 15]
        });

        L.marker([site.lat, site.lng], { icon: siteIcon })
          .bindPopup(`
            <div class="p-4 bg-white text-slate-900 rounded-2xl text-xs font-sans min-w-[250px]">
              <div class="font-black text-slate-900 text-sm">${site.id} - ${site.name}</div>
              <div class="text-slate-500 mt-0.5">${site.location}</div>
              <div class="mt-2 text-slate-700"><span class="text-slate-400 font-semibold">Phase:</span> ${site.projectPhase}</div>
            </div>
          `).addTo(explorerMap);
      });
    }

    function renderExplorerAssets() {
      const assets = SEED_DATA.assets;
      assets.forEach(asset => {
        if (!asset.lat || !asset.lng) return;

        let colorClass = "bg-emerald-500 border-white";
        if (asset.status === "Unassigned" || !asset.siteId) colorClass = "bg-rose-600 border-white";
        else if (asset.status === "Idle" || asset.idleHoursDay > asset.engineHoursDay) colorClass = "bg-amber-500 border-white";

        const icon = L.divIcon({
          className: "cat-asset-pin relative",
          html: `<div class="flex items-center justify-center w-8 h-8 ${colorClass} border-2 rounded-full text-white text-xs font-black shadow-md cursor-pointer transform hover:scale-125 transition-transform">
            <span>🚜</span>
          </div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const photoUrl = asset.imageUrl || "https://desimachines.com/wp-content/uploads/2024/12/desi-machines-cat-excavator-345-gc-featured.jpg";

        const marker = L.marker([asset.lat, asset.lng], { icon: icon })
          .bindPopup(`
            <div class="p-4 bg-white text-slate-900 rounded-2xl text-xs font-sans min-w-[240px] space-y-2">
              <div class="h-24 rounded-xl overflow-hidden relative border border-slate-200"
                   style="background: linear-gradient(to bottom, rgba(15,23,42,0.1), rgba(15,23,42,0.85)), url('${photoUrl}'); background-size: cover; background-position: center;">
                <div class="absolute bottom-2 left-2 right-2 text-white">
                  <div class="font-extrabold text-amber-400 text-xs font-mono">${asset.id}</div>
                  <div class="text-[10px] text-slate-200">${asset.model}</div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                <div><span class="text-slate-400">Site:</span> <span class="font-bold ${asset.siteId ? 'text-slate-800' : 'text-rose-600'}">${asset.siteId || 'UNASSIGNED'}</span></div>
                <div><span class="text-slate-400">Status:</span> <span class="font-bold">${asset.status}</span></div>
                <div><span class="text-slate-400">Work:</span> <span class="font-bold text-emerald-700">${asset.engineHoursDay}h/d</span></div>
                <div><span class="text-slate-400">Idle:</span> <span class="font-bold ${asset.idleHoursDay > 5 ? 'text-amber-700' : 'text-slate-800'}">${asset.idleHoursDay}h/d</span></div>
              </div>
            </div>
          `);

        marker.addTo(explorerMap);
        explorerAssetMarkers.push({ id: asset.id, marker: marker });
      });
    }

    function renderSidebarAssets(assets) {
      const container = document.getElementById("sidebar-asset-list");
      if (!container) return;

      container.innerHTML = assets.map(a => `
        <div onclick="explorerFlyToAsset('${a.id}')" class="p-3 bg-white hover:bg-amber-50/60 rounded-xl border border-slate-200 hover:border-amber-300 cursor-pointer transition-all shadow-sm space-y-1">
          <div class="flex items-center justify-between">
            <span class="font-black text-slate-900 font-mono text-xs">${a.id}</span>
            <span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${
              a.status === 'Unassigned' ? 'bg-rose-50 text-rose-700 border border-rose-200' :
              a.status === 'Active' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
              'bg-amber-50 text-amber-800 border border-amber-200'
            }">${a.status}</span>
          </div>
          <div class="text-[11px] text-slate-600 truncate font-medium">${a.model}</div>
          <div class="flex items-center justify-between text-[10px] text-slate-500 pt-0.5">
            <span>Site: <strong class="text-slate-800">${a.siteId || 'UNASSIGNED'}</strong></span>
            <span>Work: <strong class="text-emerald-700">${a.engineHoursDay}h</strong> / Idle: <strong class="text-amber-700">${a.idleHoursDay}h</strong></span>
          </div>
        </div>
      `).join('');
    }

    function filterSidebarAssets(query) {
      const q = query.toLowerCase();
      const filtered = SEED_DATA.assets.filter(a => 
        a.id.toLowerCase().includes(q) ||
        a.model.toLowerCase().includes(q) ||
        a.type.toLowerCase().includes(q) ||
        (a.siteId && a.siteId.toLowerCase().includes(q))
      );
      renderSidebarAssets(filtered);
    }

    function explorerFlyTo(siteId) {
      if (!explorerMap) return;
      if (siteId === "HUB") {
        explorerMap.flyTo([SEED_DATA.dealerHub.lat, SEED_DATA.dealerHub.lng], 14, { duration: 1.2 });
        return;
      }
      const site = SEED_DATA.sites.find(s => s.id === siteId);
      if (site) {
        explorerMap.flyTo([site.lat, site.lng], 14, { duration: 1.2 });
      }
    }

    function explorerFlyToAsset(assetId) {
      const asset = SEED_DATA.assets.find(a => a.id === assetId);
      if (asset && explorerMap) {
        explorerMap.flyTo([asset.lat, asset.lng], 15, { duration: 1.2 });
        const item = explorerAssetMarkers.find(m => m.id === assetId);
        if (item) item.marker.openPopup();
      }
    }

    function resetExplorerView() {
      if (explorerMap) explorerMap.flyTo([12.9800, 80.0500], 11, { duration: 1.2 });
    }
  </script>
</body>
</html>
